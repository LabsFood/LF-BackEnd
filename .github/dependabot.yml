version: 2

# Opens a PR when Node publishes a new node:22 image, so a Node security release
# reaches the image without anyone watching for it. The PR must also bump `.nvmrc`
# and `apps/.nvmrc`: CI fails until they match the Dockerfile.
updates:
  - package-ecosystem: docker
    directory: /apps
    schedule:
      interval: daily
    # "fix(deps): ..." passes the PR title check and cuts a patch release.
    commit-message:
      prefix: fix
      include: scope
    ignore:
      # A new Node major is a migration, not a bump.
      - dependency-name: node
        update-types: [version-update:semver-major]
