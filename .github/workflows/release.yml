name: SemRelease

# Called by "LF API Server image" (docker.yml) once the build + migrate +
# health-check smoke test has passed for a push to main. It must run inside that
# run, not from a workflow_run trigger: workflow_run sets GITHUB_REF to the
# repository's default branch (develop), so semantic-release saw "develop" and
# published nothing. The version comes from Conventional Commit messages since
# the last v*.*.* tag; CHANGELOG.md and apps/package.json are committed back to
# main as "chore(release): x.y.z [skip ci]".

on:
  workflow_call:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # tag, GitHub Release, release commit
  issues: write # "released in vX" comments, failure issue
  pull-requests: write
  actions: write # start "Deploy production"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # The commit that passed the smoke test. If main has moved since,
      # semantic-release skips and the newer commit's run releases instead.
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          npx --yes
          -p semantic-release@24
          -p @semantic-release/changelog@6
          -p @semantic-release/git@10
          -p conventional-changelog-conventionalcommits@8
          semantic-release

      # A published version is queued for production straight away; the deploy
      # still waits for a reviewer on the `production` environment.
      - name: Request production deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$(git tag -l 'v*' --points-at HEAD | head -1)"
          if [ -z "$tag" ]; then echo "No new version: nothing to deploy."; exit 0; fi
          gh workflow run deploy-production.yml --ref main -f ref="$tag"
          echo "Deploy of $tag requested: approve it under Actions → Deploy production." >> "$GITHUB_STEP_SUMMARY"
