services:
  postgres:
    image: postgres:16-alpine
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      POSTGRES_USER: lf
      POSTGRES_PASSWORD: lf
      POSTGRES_DB: lf_backend
    ports:
      - "5432:5432"
    volumes:
      - lf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lf -d lf_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Messaging: rate limit and realtime fan-out. Nothing durable is kept in it.
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/Dockerfile
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DEBUG: ${DEBUG:-false}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      # Docker-local DB defaults; override with DOCKER_* vars if needed.
      SUPABASE_DB_URL: ${DOCKER_SUPABASE_DB_URL:-postgresql://lf:lf@postgres:5432/lf_backend}
      SUPABASE_DB_MIGRATION_URL: ${DOCKER_SUPABASE_DB_MIGRATION_URL:-postgresql://lf:lf@postgres:5432/lf_backend}
      REDIS_URL: ${DOCKER_REDIS_URL:-redis://redis:6379/0}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@labsfood.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Labs Food}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_PUBLIC_BASE_URL: ${R2_PUBLIC_BASE_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  lf_pg_data:
