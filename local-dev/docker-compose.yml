name: labsfood

# Orchestration locale full-stack pour les 4 services LabsFood + Postgres.
# Ce fichier vit dans LF-BackEnd/local-dev/ mais doit etre COPIE (ou lie) a la
# racine du dossier parent qui contient les 4 repos clones cote a cote.
# Voir LF-BackEnd/LOCAL_SETUP.md pour les instructions completes.
#
# Les secrets sont lus depuis un seul `.env` racine (voir .env.example dans ce
# meme dossier), auto-charge par Compose car il doit se trouver a cote de ce
# fichier une fois copie a la racine.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: lf
      POSTGRES_PASSWORD: lf
      POSTGRES_DB: lf_backend
    ports:
      # Si le port 55432 est deja pris sur votre machine par un autre projet,
      # changez uniquement le cote gauche, ex. "55433:5432".
      - "55432:5432"
    volumes:
      - lf_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lf -d lf_backend"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./LF-BackEnd
      dockerfile: apps/Dockerfile
    environment:
      NODE_ENV: development
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SUPABASE_DB_URL: postgresql://lf:lf@postgres:5432/lf_backend
      SUPABASE_DB_MIGRATION_URL: postgresql://lf:lf@postgres:5432/lf_backend
      CORS_ORIGINS: http://localhost:3005,http://localhost:3007,http://localhost:8035
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:-sk_test_placeholder}
      CLERK_WEBHOOK_SIGNING_SECRET: ${CLERK_WEBHOOK_SIGNING_SECRET:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      CRONOFY_CLIENT_ID: ${CRONOFY_CLIENT_ID:-}
      CRONOFY_CLIENT_SECRET: ${CRONOFY_CLIENT_SECRET:-}
      CRONOFY_DATA_CENTER: ${CRONOFY_DATA_CENTER:-us}
      STREAM_API_KEY: ${STREAM_API_KEY:-}
      STREAM_API_SECRET: ${STREAM_API_SECRET:-}
      STREAM_APP_ID: ${STREAM_APP_ID:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      BREVO_SENDER_EMAIL: ${BREVO_SENDER_EMAIL:-noreply@labsfood.com}
      BREVO_SENDER_NAME: ${BREVO_SENDER_NAME:-Labs Food}
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_REGION: ${AWS_REGION:-eu-west-3}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  batchcooking-web:
    build:
      context: ./batchcooking-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports:
      - "3005:3000"
    restart: unless-stopped

  labsfood-web:
    build:
      context: ./labsfood-web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      BREVO_SMTP_USER: ${BREVO_SMTP_USER:-}
      BREVO_SMTP_PASS: ${BREVO_SMTP_PASS:-}
      BREVO_FROM_EMAIL: ${BREVO_FROM_EMAIL:-}
      CONTACT_TO_EMAIL: ${CONTACT_TO_EMAIL:-}
    depends_on: [api]
    ports:
      - "3007:3000"
    restart: unless-stopped

  admin-dashboard:
    build:
      context: ./admin-dashboard
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on: [api]
    ports:
      - "8035:3000"
    restart: unless-stopped

volumes:
  lf_pg_data:
